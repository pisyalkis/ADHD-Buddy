name: Nightly checks

on:
  schedule:
    # 22:00 UTC = 02:00 Тбилиси (UTC+4)
    - cron: "0 22 * * *"
  workflow_dispatch: {}

jobs:
  compile-and-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install pyflakes

      - name: Compile check
        run: python3 -m py_compile bot.py

      - name: Pyflakes
        run: python3 -m pyflakes bot.py
